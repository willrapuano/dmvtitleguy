name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Both defects that froze this repo for three weeks in September 2026 were
  # caused by time passing, not by anyone changing code: a fixture checkpoint
  # date fell into the past, a signed watchdog receipt aged out of its 168-hour
  # window, and two pinned overrides drifted below their advisories' fixed
  # versions. Nothing was pushed, so nothing ran, and the breakage only
  # surfaced when an unrelated PR arrived and appeared to be at fault.
  # A daily run finds that class of failure on the day it happens.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-receipt:
    name: configured-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Authenticate configured SEO health receipts
        run: npm run verify:seo-operational-health:configured-receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    name: verify
    needs: configured-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:lead-attribution
      - run: npm run verify:seo-operational-health:behavior
      - name: Verify static SEO operational-health release controls
        run: npm run verify:seo-operational-health
      - run: npm run verify:blog-normalizer
      - run: npm run verify:dependency-overrides
      - run: npm run build
      - name: Verify built application contracts
        run: |
          npm run start -- -p 3101 > /tmp/dmvtitleguy-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3101/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3101/ > /dev/null; then
            cat /tmp/dmvtitleguy-next.log
            exit 1
          fi
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:blog-rendering
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:blog-publication
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:migration
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:sitemap-completeness
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:social-metadata
          TARGET_ORIGIN=http://127.0.0.1:3101 npm run verify:lead-security
      - run: npm run security:audit
